apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: minecraft
spec:
  # LoadBalancer → k3s ServiceLB exposes 25565 on the node LAN IP for direct play.
  # The same Service (ClusterIP) is the target for the playit-agent (remote access).
  type: LoadBalancer
  selector:
    app: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      protocol: TCP
