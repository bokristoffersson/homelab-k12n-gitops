apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-config
  namespace: minecraft
data:
  EULA: "TRUE"
  TYPE: "PAPER"
  VERSION: "26.2"            # pinned; bump deliberately (world format migrates across majors)
  MEMORY: "3G"              # JVM heap; keep below the 4Gi container limit for GC overhead
  USE_AIKAR_FLAGS: "TRUE"   # recommended Paper JVM/GC flags
  ONLINE_MODE: "TRUE"       # enforce Mojang auth — never disable
  ENABLE_WHITELIST: "TRUE"
  ENFORCE_WHITELIST: "TRUE"
  # TODO(bo): add Minecraft usernames (comma-separated) before first join, e.g. "Steve,Alex".
  # Empty = the server runs but rejects ALL joins. Can also add live via RCON: `whitelist add <name>`.
  WHITELIST: ""
  OPS: ""                   # admin usernames (comma-separated)
  DIFFICULTY: "normal"
  MODE: "survival"
  MOTD: "k12n homelab"
  MAX_PLAYERS: "10"
  VIEW_DISTANCE: "10"
  SIMULATION_DISTANCE: "8"
  TZ: "Europe/Stockholm"
  ENABLE_RCON: "TRUE"
  OVERRIDE_SERVER_PROPERTIES: "TRUE"  # apply changes from this ConfigMap on restart
