---
apiVersion: v1
kind: Namespace
metadata:
  name: homebridge
  labels:
    app: homebridge
    # Homebridge runs with hostNetwork + hostPorts (51826 for HomeKit, 8581 for
    # its UI), which violates the cluster-global PSA `enforce: baseline` (set on
    # the M720q k3s server). Pin this namespace to the privileged PSA level so
    # its pod can be created. (No-op on clusters that don't enforce PSA.)
    pod-security.kubernetes.io/enforce: privileged
