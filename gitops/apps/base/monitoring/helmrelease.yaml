# ONE-TIME BOOTSTRAP NOTE:
# This release was previously left stuck in Helm status "uninstalling" after
# its HelmRelease was pruned from GitOps. Flux cannot adopt a release in that
# state. If Prometheus/Alertmanager pods never appear after reconcile, clear
# the stuck release record once, then reconcile:
#   kubectl delete secret -n monitoring sh.helm.release.v1.kube-prometheus-stack.v1
#   flux reconcile kustomization prometheus --with-source
# The delete is idempotent (fails harmlessly if the secret is absent), so it
# is only needed for that specific stuck state, not on a clean cluster.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring # Create this namespace first
spec:
  interval: 15m
  install:
    crds: CreateReplace  # Ensure CRDs are installed
  upgrade:
    crds: CreateReplace  # Ensure CRDs are updated
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 77.12.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 15m
  values:

    prometheus:
      prometheusSpec:
        # Reinstated after briefly removing this for the M720q migration prep
        # (Fas 0): the old cluster is still live and still 2 nodes until Fas 5,
        # and dropping the pin let the scheduler put Prometheus straight back
        # on p0 - confirmed at 96% CPU within minutes of the change landing.
        # p0 is CPU-saturated by stateful workloads (redpanda, timescaledb),
        # and Prometheus competing for that CPU destabilises the redpanda
        # broker's raft/consumer-group coordination. Remove again only as
        # part of the actual Fas 5 cutover, once the M720q is the only node
        # Prometheus can land on anyway.
        nodeSelector:
          kubernetes.io/hostname: p1
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 50Gi

        retention: 15d
        retentionSize: 45GB

        # Single-cluster homelab: stamp a cluster label so the community
        # dashboards (which filter on cluster="$cluster") resolve to data.
        externalLabels:
          cluster: homelab

        # Discover ServiceMonitors/PodMonitors/Rules across ALL namespaces,
        # not just those carrying this release's Helm labels. Without this the
        # operator-managed Prometheus scrapes almost nothing in a GitOps setup.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false

        resources:
          requests:
            cpu: 200m
            memory: 768Mi
          limits:
            memory: 1536Mi

    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi

    # Grafana is deployed separately (grafana namespace / own HelmRelease).
    grafana:
      enabled: false