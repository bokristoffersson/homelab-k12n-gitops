# ONE-TIME BOOTSTRAP NOTE:
# This release was previously left stuck in Helm status "uninstalling" after
# its HelmRelease was pruned from GitOps. Flux cannot adopt a release in that
# state. If Prometheus/Alertmanager pods never appear after reconcile, clear
# the stuck release record once, then reconcile:
#   kubectl delete secret -n monitoring sh.helm.release.v1.kube-prometheus-stack.v1
#   flux reconcile kustomization prometheus --with-source
# The delete is idempotent (fails harmlessly if the secret is absent), so it
# is only needed for that specific stuck state, not on a clean cluster.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring # Create this namespace first
spec:
  interval: 15m
  install:
    crds: CreateReplace  # Ensure CRDs are installed
  upgrade:
    crds: CreateReplace  # Ensure CRDs are updated
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 77.12.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 15m
  values:

    prometheus:
      prometheusSpec:
        # nodeSelector pin (kubernetes.io/hostname: p1) removed at the Fas 5
        # cutover: the old cluster is gone and Prometheus can now schedule on any
        # of the 3 new nodes (m720q/pi0/pi1). History: it was pinned to keep
        # Prometheus off the CPU-saturated old p0, which otherwise destabilised
        # the redpanda broker's raft/consumer-group coordination.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 50Gi

        retention: 15d
        retentionSize: 45GB

        # Single-cluster homelab: stamp a cluster label so the community
        # dashboards (which filter on cluster="$cluster") resolve to data.
        externalLabels:
          cluster: homelab

        # Discover ServiceMonitors/PodMonitors/Rules across ALL namespaces,
        # not just those carrying this release's Helm labels. Without this the
        # operator-managed Prometheus scrapes almost nothing in a GitOps setup.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false

        resources:
          requests:
            cpu: 200m
            memory: 768Mi
          limits:
            memory: 1536Mi

    alertmanager:
      alertmanagerSpec:
        # Mount the existing slack-webhook secret (the same one the health-check
        # CronJob uses) so the Slack receiver reads the webhook URL from a file —
        # no plaintext URL in git.
        secrets:
          - slack-webhook
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ["namespace", "alertname"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          receiver: slack
          routes:
            # Watchdog (always-firing dead-man's switch) + InfoInhibitor are
            # internal signals — never notify.
            - receiver: "null"
              matchers:
                - alertname =~ "Watchdog|InfoInhibitor"
        receivers:
          - name: "null"
          - name: slack
            slack_configs:
              - api_url_file: /etc/alertmanager/secrets/slack-webhook/SLACK_WEBHOOK_URL
                channel: "#homelab-alerts"   # webhook is channel-bound; adjust if desired
                send_resolved: true
                title: '{{ if eq .Status "firing" }}🔥 FIRING{{ else }}✅ RESOLVED{{ end }} | {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
                text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ if .Annotations.description }} — {{ .Annotations.description }}{{ end }}{{ "\n" }}{{ end }}'

    # Grafana is deployed separately (grafana namespace / own HelmRelease).
    grafana:
      enabled: false

    # k3s runs kube-controller-manager, kube-scheduler and kube-proxy embedded in
    # the k3s process and does not expose the metrics endpoints kube-prometheus-
    # stack scrapes — so KubeControllerManagerDown / KubeSchedulerDown /
    # KubeProxyDown fire as permanent false positives. Disable those components'
    # ServiceMonitors and their alert rules.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    defaultRules:
      rules:
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeProxy: false