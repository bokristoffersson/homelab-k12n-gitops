apiVersion: batch/v1
kind: CronJob
metadata:
  name: monitoring-health-check
  namespace: monitoring
spec:
  schedule: "*/15 * * * *"  # Every 15 minutes
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # A single transient (DB/broker briefly unreachable) should not leave a
      # permanent Failed job; and finished jobs self-clean after 48h so a
      # Failed one cannot keep KubeJobFailed firing for weeks.
      backoffLimit: 2
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            app: monitoring-health-check
        spec:
          serviceAccountName: monitoring
          restartPolicy: OnFailure
          containers:
            - name: health-check
              image: alpine/k8s:1.30.7
              command:
                - /bin/sh
                - -c
                - |
                  apk add --no-cache curl
                  sh /scripts/check-health.sh
              env:
                - name: SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: slack-webhook
                      key: SLACK_WEBHOOK_URL
                # Dead man's switch (healthchecks.io ping URL). Optional so the
                # CronJob runs before the sealed secret exists; the script skips
                # the ping when the variable is unset.
                - name: HEALTHCHECKS_PING_URL
                  valueFrom:
                    secretKeyRef:
                      name: healthchecks-ping
                      key: HEALTHCHECKS_PING_URL
                      optional: true
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          volumes:
            - name: scripts
              configMap:
                name: monitoring-script
                defaultMode: 0755
