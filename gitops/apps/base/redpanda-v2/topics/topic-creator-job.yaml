---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-topics
  namespace: redpanda-v2
  annotations:
    # Force new job on each apply
    timestamp: "TIMESTAMP_PLACEHOLDER"
spec:
  ttlSecondsAfterFinished: 300  # Clean up 5 minutes after completion
  template:
    metadata:
      labels:
        app: topic-creator
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rpk
          image: docker.redpanda.com/redpandadata/redpanda:v25.3.1
          command:
            - /bin/sh
            - -c
            - |
              set -e

              # Wait for Redpanda to be ready
              until rpk cluster info --brokers redpanda-v2.redpanda-v2.svc.cluster.local:9092 2>/dev/null; do
                echo "Waiting for Redpanda to be ready..."
                sleep 5
              done

              echo "Redpanda is ready. Creating topics..."

              BROKERS=redpanda-v2.redpanda-v2.svc.cluster.local:9092

              # This Job is recreated every Flux interval (TTL below), so skip topics
              # that already exist instead of letting the broker log a
              # topic_already_exists warning for each one on every run.
              create_topic() {
                topic="$1"; retention_ms="$2"
                if rpk topic describe "$topic" --brokers "$BROKERS" >/dev/null 2>&1; then
                  echo "Topic $topic already exists"
                  return
                fi
                rpk topic create "$topic" \
                  --brokers "$BROKERS" \
                  --partitions 1 \
                  --replicas 1 \
                  --topic-config retention.ms="$retention_ms" \
                  --topic-config segment.ms=3600000
              }

              # Topic names match the homelab-* names produced by mqtt-kafka-bridge
              # and consumed by the timescaledb sink, energy-ws and homelab-settings.
              create_topic homelab-energy-realtime 86400000
              create_topic homelab-heatpump-telemetry 3600000
              create_topic homelab-plug-telemetry 86400000
              create_topic homelab-temperature-indoor 86400000
              create_topic homelab-temperature-outdoor 86400000

              echo "All topics created successfully!"

              # List topics to verify
              rpk topic list --brokers "$BROKERS"
