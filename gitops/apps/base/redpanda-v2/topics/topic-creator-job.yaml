---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-topics
  namespace: redpanda-v2
  annotations:
    # Force new job on each apply
    timestamp: "TIMESTAMP_PLACEHOLDER"
spec:
  ttlSecondsAfterFinished: 300  # Clean up 5 minutes after completion
  template:
    metadata:
      labels:
        app: topic-creator
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rpk
          image: docker.redpanda.com/redpandadata/redpanda:v25.3.1
          command:
            - /bin/sh
            - -c
            - |
              set -e

              # Wait for Redpanda to be ready
              until rpk cluster info --brokers redpanda-v2.redpanda-v2.svc.cluster.local:9092 2>/dev/null; do
                echo "Waiting for Redpanda to be ready..."
                sleep 5
              done

              echo "Redpanda is ready. Creating topics..."

              # Topic names match the homelab-* names produced by mqtt-kafka-bridge
              # and consumed by the timescaledb sink, energy-ws and homelab-settings.
              # rpk topic create is idempotent - skips if the topic already exists.
              rpk topic create homelab-energy-realtime \
                --brokers redpanda-v2.redpanda-v2.svc.cluster.local:9092 \
                --partitions 1 \
                --replicas 1 \
                --topic-config retention.ms=86400000 \
                --topic-config segment.ms=3600000 || echo "Topic homelab-energy-realtime already exists"

              rpk topic create homelab-heatpump-telemetry \
                --brokers redpanda-v2.redpanda-v2.svc.cluster.local:9092 \
                --partitions 1 \
                --replicas 1 \
                --topic-config retention.ms=3600000 \
                --topic-config segment.ms=3600000 || echo "Topic homelab-heatpump-telemetry already exists"

              rpk topic create homelab-plug-telemetry \
                --brokers redpanda-v2.redpanda-v2.svc.cluster.local:9092 \
                --partitions 1 \
                --replicas 1 \
                --topic-config retention.ms=86400000 \
                --topic-config segment.ms=3600000 || echo "Topic homelab-plug-telemetry already exists"

              rpk topic create homelab-temperature-indoor \
                --brokers redpanda-v2.redpanda-v2.svc.cluster.local:9092 \
                --partitions 1 \
                --replicas 1 \
                --topic-config retention.ms=86400000 \
                --topic-config segment.ms=3600000 || echo "Topic homelab-temperature-indoor already exists"

              rpk topic create homelab-temperature-outdoor \
                --brokers redpanda-v2.redpanda-v2.svc.cluster.local:9092 \
                --partitions 1 \
                --replicas 1 \
                --topic-config retention.ms=86400000 \
                --topic-config segment.ms=3600000 || echo "Topic homelab-temperature-outdoor already exists"

              echo "All topics created successfully!"

              # List topics to verify
              rpk topic list --brokers redpanda-v2.redpanda-v2.svc.cluster.local:9092
