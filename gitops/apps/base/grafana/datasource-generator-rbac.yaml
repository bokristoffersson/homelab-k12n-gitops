apiVersion: v1
kind: ServiceAccount
metadata:
  name: datasource-configmap-generator
  namespace: grafana
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: datasource-configmap-generator
  namespace: grafana
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["grafana-timescaledb-secret"]
  verbs: ["get"]
# NOTE: `create` cannot be combined with resourceNames — Kubernetes RBAC
# ignores resourceNames for create (the object name is unknown at admission),
# so a resourceNames-scoped rule that lists `create` never authorizes it.
# On a fresh cluster the target ConfigMap does not exist yet, so the generator
# must create it; split create into its own unscoped rule and keep the named
# get/update/patch for least privilege.
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["grafana-timescaledb-datasource"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: datasource-configmap-generator
  namespace: grafana
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: datasource-configmap-generator
subjects:
- kind: ServiceAccount
  name: datasource-configmap-generator
  namespace: grafana

