# Immediate power-state echo. Tasmota publishes stat/<plug>/POWER the moment a
# command is applied, while tele/+/STATE only arrives every TelePeriod (up to
# 300s). Feeding stat into the same topic lets the outbox processor confirm
# commands within seconds instead of minutes. Payload is the plain string
# ON/OFF, so this is a separate stream from the JSON-based power-plugs.yaml.
input:
  mqtt:
    urls:
      - tcp://mosquitto.mosquitto.svc.cluster.local:1883
    topics:
      - stat/+/POWER
    client_id: mqtt-redpanda-bridge-power-plugs-stat
    user: ${MQTT_USER}
    password: ${MQTT_PASSWORD}
    clean_session: true
    qos: 1
    keepalive: 30

pipeline:
  processors:
    - mapping: |
        root = {}
        root.ts = now().ts_format("2006-01-02T15:04:05.999999999Z07:00")
        root.plug_id = meta("mqtt_topic").split("/").index(1)
        root.status = content().string() == "ON"

output:
  kafka:
    addresses:
      - ${REDPANDA_BROKERS}
    topic: homelab-plug-telemetry
    client_id: mqtt-redpanda-bridge-power-plugs-stat
    compression: snappy
    max_in_flight: 10
