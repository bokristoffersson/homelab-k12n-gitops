---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: gasa
spec:
  # Run daily at 2:45 AM (offset from TimescaleDB 2:00 and homelab-settings 2:15)
  schedule: "45 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: OnFailure
          # Co-locate with postgres on m720q: dump traffic stays node-local.
          # (amazon/aws-cli:2.36.14 is multi-arch amd64+arm64, so this is a
          # locality choice, not an architecture requirement.)
          nodeSelector:
            kubernetes.io/hostname: m720q
          # Dump and upload run as separate stock images sharing an emptyDir,
          # so nothing is installed at runtime (no apt-get in the pod).
          initContainers:
            - name: dump
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  set -o pipefail

                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_FILE="/backup/gasa-${TIMESTAMP}.sql.gz"

                  echo "Starting backup of database ${PGDATABASE}..."
                  pg_dump -h $PGHOST -p $PGPORT -U $PGUSER -d $PGDATABASE -F p -b | gzip > "$BACKUP_FILE"

                  echo "Backup created:"
                  ls -lh "$BACKUP_FILE"

                  # Sanity check: a real dump is never this small. Catches
                  # silent failures (e.g. bad credentials) that pipefail
                  # alone wouldn't - gzip still exits 0 on an empty stream.
                  MIN_BYTES=1024
                  ACTUAL_BYTES=$(stat -c%s "$BACKUP_FILE")
                  if [ "$ACTUAL_BYTES" -lt "$MIN_BYTES" ]; then
                    echo "ERROR: backup file is suspiciously small (${ACTUAL_BYTES} bytes, expected >= ${MIN_BYTES})"
                    exit 1
                  fi
              env:
                - name: PGHOST
                  value: postgres
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: DATABASE_USERNAME
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: DATABASE_PASSWORD
                - name: PGDATABASE
                  value: gasa
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: amazon/aws-cli:2.36.14
              command:
                - /bin/sh
                - -c
                - |
                  set -e

                  BACKUP_FILE=$(ls /backup/gasa-*.sql.gz)
                  S3_KEY="${S3_PREFIX}/$(basename $BACKUP_FILE)"

                  echo "Uploading to s3://${S3_BUCKET}/${S3_KEY}..."
                  aws s3 cp "$BACKUP_FILE" "s3://${S3_BUCKET}/${S3_KEY}" --region $AWS_REGION

                  # Verify upload
                  if aws s3 ls "s3://${S3_BUCKET}/${S3_KEY}" --region $AWS_REGION > /dev/null 2>&1; then
                    echo "Backup successfully uploaded to S3"
                  else
                    echo "ERROR: Failed to verify backup in S3"
                    exit 1
                  fi

                  echo "Backup complete"
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-aws
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-aws
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_REGION
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-aws
                      key: AWS_REGION
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-aws
                      key: S3_BUCKET
                - name: S3_PREFIX
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-aws
                      key: S3_PREFIX
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              emptyDir: {}
