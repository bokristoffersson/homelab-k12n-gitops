---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gasa-web
  namespace: gasa
  labels:
    app: gasa-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gasa-web
  template:
    metadata:
      labels:
        app: gasa-web
    spec:
      containers:
        - name: web
          image: ghcr.io/bokristoffersson/gasa-web:main
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          env:
            # Same-origin API - empty base URL
            - name: VITE_API_URL
              value: ""
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
