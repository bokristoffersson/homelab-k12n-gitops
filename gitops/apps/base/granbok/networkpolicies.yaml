# Default deny all ingress; then: agent + gateway -> core, ServiceLB -> gateway,
# core + backup -> postgres and object storage. Egress is not restricted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: granbok
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: core
  namespace: granbok
spec:
  podSelector:
    matchLabels:
      app: granbok-core
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: granbok-agent
        - podSelector:
            matchLabels:
              app: granbok-gateway
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
  namespace: granbok
spec:
  podSelector:
    matchLabels:
      app: granbok-gateway
  policyTypes:
    - Ingress
  ingress:
    # klipper-lb (ServiceLB) masquerades LAN traffic to its svclb pod IP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              svccontroller.k3s.cattle.io/svcname: granbok-gateway
              svccontroller.k3s.cattle.io/svcnamespace: granbok
      ports:
        - port: 8443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: granbok
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: granbok-core
        - podSelector:
            matchLabels:
              app: granbok-backup
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: object-storage
  namespace: granbok
spec:
  podSelector:
    matchLabels:
      app: object-storage
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: granbok-core
        - podSelector:
            matchLabels:
              app: granbok-backup
      ports:
        - port: 9000
          protocol: TCP
