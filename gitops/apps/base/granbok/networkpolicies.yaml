# Default deny all ingress; then: agent + gateway -> core, LAN -> gateway,
# core + backup -> postgres and object storage. Egress is not restricted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: granbok
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: core
  namespace: granbok
spec:
  podSelector:
    matchLabels:
      app: granbok-core
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: granbok-agent
        - podSelector:
            matchLabels:
              app: granbok-gateway
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
  namespace: granbok
spec:
  podSelector:
    matchLabels:
      app: granbok-gateway
  policyTypes:
    - Ingress
  ingress:
    # LAN clients only. ServiceLB does not masquerade to the svclb pod IP: the
    # policy sees the client's LAN address (verified 2026-11-13; a svclb pod
    # selector rejected every LAN client with "connection refused").
    - from:
        - ipBlock:
            cidr: 192.168.50.0/24
      ports:
        - port: 8443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: granbok
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: granbok-core
        - podSelector:
            matchLabels:
              app: granbok-backup
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: object-storage
  namespace: granbok
spec:
  podSelector:
    matchLabels:
      app: object-storage
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: granbok-core
        - podSelector:
            matchLabels:
              app: granbok-backup
      ports:
        - port: 9000
          protocol: TCP
