# Nightly copy of the bookkeeping to AWS S3 (k12n-granbok-backups: versioning +
# object lock, default retention 8 years). The two parts belong together and
# are taken in this order while everything runs:
#   1. the database (pg_dump --format=custom with a v18 client)
#   2. every document in the bucket (content-addressed, never changed)
# Layout in S3:  <prefix>/db/<UTC timestamp>/{granbok.dump,completed-at}
#                <prefix>/documents/<company>/<sha256>
# The backup key may put/get/list only; it cannot delete or shorten retention.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: granbok-backup
  namespace: granbok
spec:
  # 03:30 UTC, after the etcd snapshot at 03:00
  schedule: "30 3 * * *"
  timeZone: Etc/UTC
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: granbok-backup
        spec:
          restartPolicy: Never
          # Co-locate with postgres and object storage on m720q
          nodeSelector:
            kubernetes.io/hostname: m720q
          initContainers:
            - name: dump
              image: postgres:18.6-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # k3s' network policy controller admits a new pod's IP about
                  # a second after it starts; until then postgres refuses the
                  # connection. Wait for it (and for postgres itself).
                  i=0
                  until pg_isready -h postgres -p 5432 -t 2 > /dev/null; do
                    i=$((i + 1))
                    if [ "$i" -ge 30 ]; then echo "postgres not reachable"; exit 1; fi
                    sleep 2
                  done
                  # A retried pod gets a fresh emptyDir, but be explicit
                  rm -rf /backup/granbok.dump /backup/granbok.dump.partial
                  pg_dump -h postgres -U granbok -d granbok --format=custom \
                    -f /backup/granbok.dump.partial
                  # Fails on a truncated or corrupt archive
                  pg_restore --list /backup/granbok.dump.partial > /dev/null
                  mv /backup/granbok.dump.partial /backup/granbok.dump
                  ls -l /backup/granbok.dump
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: POSTGRES_PASSWORD
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
            - name: documents
              image: amazon/aws-cli:2.39.5
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  mkdir -p /backup/documents
                  aws s3 sync s3://granbok-documents /backup/documents \
                    --endpoint-url http://object-storage:9000 --only-show-errors
                  echo "documents: $(find /backup/documents -type f | wc -l) files"
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: object-storage-credentials
                      key: ACCESS_KEY
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: object-storage-credentials
                      key: SECRET_KEY
                - name: AWS_DEFAULT_REGION
                  value: eu-north-1
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: amazon/aws-cli:2.39.5
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  DEST="s3://${S3_BUCKET}/${S3_PREFIX}"

                  # Documents first: once completed-at exists, everything the
                  # dump refers to is guaranteed to be in S3 already.
                  aws s3 sync /backup/documents "${DEST}/documents" --only-show-errors
                  aws s3 cp /backup/granbok.dump "${DEST}/db/${TS}/granbok.dump" --only-show-errors

                  date -u +%Y-%m-%dT%H:%M:%SZ > /backup/completed-at
                  aws s3 cp /backup/completed-at "${DEST}/db/${TS}/completed-at" --only-show-errors

                  aws s3 ls "${DEST}/db/${TS}/"
                  echo "Backup ${TS} complete"
              envFrom:
                # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, S3_BUCKET, S3_PREFIX
                - secretRef:
                    name: granbok-backup-aws
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            # Stages the dump plus a full copy of the documents on m720q's disk.
            # Sized to the object-data PVC (20Gi) + dump headroom: raise it
            # when that PVC is expanded. Exceeding it evicts the pod, the job
            # fails and GranbokBackupFailed fires.
            - name: backup
              emptyDir:
                sizeLimit: 25Gi
