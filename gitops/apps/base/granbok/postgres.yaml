apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: granbok
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Pin to the primary Longhorn storage node so the volume replica is local
      nodeSelector:
        kubernetes.io/hostname: m720q
      # The alpine image's postgres user is uid/gid 70 (999 is the Debian image)
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          # Major version upgrades only when the owner asks for it
          image: postgres:18.6-alpine
          env:
            - name: POSTGRES_DB
              value: granbok
            - name: POSTGRES_USER
              value: granbok
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "granbok", "-d", "granbok"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "granbok", "-d", "granbok"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # postgres 18 images keep PGDATA under /var/lib/postgresql/18/docker
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: granbok
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
