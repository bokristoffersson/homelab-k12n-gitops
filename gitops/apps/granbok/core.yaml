# Web UI and API. Exactly one replica, Recreate: the core migrates the schema
# on startup, so two versions must never run at the same time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: granbok-core
  namespace: granbok
spec:
  replicas: 1
  selector:
    matchLabels:
      app: granbok-core
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: granbok-core
    spec:
      nodeSelector:
        kubernetes.io/hostname: m720q
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: core
          # Upgrade core and agent together, after a verified backup
          image: ghcr.io/bokristoffersson/granbok-core:0.10.0
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/granbok
            - name: SPRING_DATASOURCE_USERNAME
              value: granbok
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: GRANBOK_S3_ENDPOINT
              value: http://object-storage:9000
            - name: GRANBOK_S3_BUCKET
              value: granbok-documents
            - name: GRANBOK_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-credentials
                  key: ACCESS_KEY
            - name: GRANBOK_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-credentials
                  key: SECRET_KEY
            # The LAN gateway terminates TLS and sets X-Forwarded-*
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: native
            # Web login via Authelia; the core fetches the issuer metadata on startup
            - name: GRANBOK_OIDC_ISSUER
              value: https://auth.k12n.com
            - name: GRANBOK_OIDC_CLIENT_ID
              value: granbok
            # iOS app API under /app/v1: exactly the audience of the Authelia client granbok-app
            - name: GRANBOK_APP_AUDIENCE
              value: https://granbok.k12n.com
            # The core reads this mailbox over IMAP; each account gets a plus address in it
            - name: GRANBOK_RECEIPT_MAILBOX
              value: kvittogranskogen@gmail.com
            # APNs push to the iOS app; the core reaches api(.sandbox).push.apple.com:443
            - name: GRANBOK_PUSH_KEY_FILE
              value: /push/AuthKey.p8
            - name: GRANBOK_PUSH_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: granbok-push
                  key: KEY_ID
            - name: GRANBOK_PUSH_TEAM_ID
              valueFrom:
                secretKeyRef:
                  name: granbok-push
                  key: TEAM_ID
          envFrom:
            # Owner username (kept: Flyway reads it), OIDC client secret, the three agent
            # API passwords, receipt mailbox IMAP login, Bolagsverket client
            - secretRef:
                name: granbok-core
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            httpGet:
              path: /login
              port: 8080
            periodSeconds: 5
            # Up to 5 minutes: startup is slower when the schema is migrated
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              # Not measured yet; adjust after observing real usage
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Uploads of up to 30 MB are buffered here
            - name: tmp
              mountPath: /tmp
            - name: push
              mountPath: /push
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: push
          secret:
            secretName: granbok-push
            items:
              - key: AuthKey.p8
                path: AuthKey.p8
---
apiVersion: v1
kind: Service
metadata:
  name: granbok-core
  namespace: granbok
spec:
  selector:
    app: granbok-core
  ports:
    - name: http
      port: 8080
      targetPort: 8080
