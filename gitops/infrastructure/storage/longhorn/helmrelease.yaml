apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: "1.10.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  values:
    defaultSettings:
      # Quieter logs: Info is noisy for a homelab. Warn still surfaces
      # degraded volumes, failed/rebuilding replicas, and attach/detach errors.
      logLevel: "Warn"
      # Disable automatic default disk creation
      defaultDataPath: ""
      upgradeChecker: false

    # Two Longhorn storage nodes (m720q + pi1; pi0 is excluded) — a 3-replica
    # volume can never become healthy and sits permanently degraded. NOTE: this
    # knob must live under `persistence.` (it renders the default StorageClass);
    # the migration-era attempt to set it under `defaultSettings.` was silently
    # ignored by the chart, so the class shipped with the chart default of 3.
    # Applies to NEW volumes only; existing volumes keep their own
    # spec.numberOfReplicas (gasa-postgres + minecraft were patched live to 2
    # on 2026-09-17).
    persistence:
      defaultClassReplicaCount: 2

    longhornManager:
      priorityClass: system-cluster-critical
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      extraEnv:
        - name: DEFAULT_DISK_PATH
          value: ""  # disables auto-created /var/lib/longhorn

    longhornDriver:
      priorityClass: system-cluster-critical
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"

    longhornUI:
      replicas: 1
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"