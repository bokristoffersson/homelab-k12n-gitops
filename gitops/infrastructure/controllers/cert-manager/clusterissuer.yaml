apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: bo.kristoffersson@gmail.com  # Replace with your email
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        # dnsZones matches the zone and every name under it (dnsNames would
        # only match the literal strings, so no subdomain certificate could
        # ever be solved)
        selector:
          dnsZones:
            - "k12n.com"
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: bo.kristoffersson@gmail.com  # Replace with your email
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        # dnsZones matches the zone and every name under it (dnsNames would
        # only match the literal strings, so no subdomain certificate could
        # ever be solved)
        selector:
          dnsZones:
            - "k12n.com"
