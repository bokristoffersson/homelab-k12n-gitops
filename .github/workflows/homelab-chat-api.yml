name: homelab-chat-api CI/CD

on:
  push:
    branches: [main]
    paths:
      - "applications/homelab-chat-api/**"
      - ".github/workflows/homelab-chat-api.yml"
      - ".github/workflows/_docker-multiarch.yml"
  pull_request:
    branches: [main]
    paths:
      - "applications/homelab-chat-api/**"
      - ".github/workflows/homelab-chat-api.yml"
      - ".github/workflows/_docker-multiarch.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    defaults:
      run:
        working-directory: applications/homelab-chat-api
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.5.14"
          enable-cache: true
          cache-dependency-glob: applications/homelab-chat-api/uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Type check (ty)
        run: uv run ty check src

      - name: Run pytest
        run: uv run pytest

  docker:
    name: Docker
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/_docker-multiarch.yml
    with:
      image: homelab-chat-api
      context: applications/homelab-chat-api
