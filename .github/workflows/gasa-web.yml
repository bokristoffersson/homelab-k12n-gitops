name: gasa-web CI

on:
  push:
    branches: [main]
    paths:
      - "applications/gasa-web/**"
      - ".github/workflows/gasa-web.yml"
      - ".github/workflows/_docker-multiarch.yml"
  pull_request:
    branches: [main]
    paths:
      - "applications/gasa-web/**"
      - ".github/workflows/gasa-web.yml"
      - ".github/workflows/_docker-multiarch.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    defaults:
      run:
        working-directory: applications/gasa-web
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: applications/gasa-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for vulnerabilities (npm audit)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run lint
        run: npm run lint

      - name: Build (includes type checking)
        run: npm run build

  docker:
    name: Docker
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/_docker-multiarch.yml
    with:
      image: gasa-web
      context: applications/gasa-web
