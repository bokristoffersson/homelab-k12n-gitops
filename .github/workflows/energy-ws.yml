name: energy-ws CI/CD

on:
  push:
    branches: [main]
    paths:
      - "applications/energy-ws/**"
      - ".github/workflows/energy-ws.yml"
      - ".github/workflows/_rust-test.yml"
      - ".github/workflows/_docker-multiarch.yml"
  pull_request:
    branches: [main]
    paths:
      - "applications/energy-ws/**"
      - ".github/workflows/energy-ws.yml"
      - ".github/workflows/_rust-test.yml"
      - ".github/workflows/_docker-multiarch.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    uses: $/.github/workflows/_rust-test.yml
    with:
      app: energy-ws

  docker:
    name: Docker
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/_docker-multiarch.yml
    with:
      image: energy-ws
      context: applications/energy-ws
