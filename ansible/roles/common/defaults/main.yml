---
# User granted passwordless sudo (the ansible connection user). Bo set this up
# manually on m720q to bootstrap; managing it here keeps it idempotent and gives
# the phase-5 agents (p0/p1) the same NOPASSWD without a manual step.
common_sudoers_user: "{{ ansible_user | default('bo') }}"

# Required by k3s protect-kernel-defaults (k3s CIS hardening guide, 90-kubelet.conf)
common_kernel_sysctls:
  vm.panic_on_oom: "0"
  vm.overcommit_memory: "1"
  kernel.panic: "10"
  kernel.panic_on_oops: "1"
  kernel.keys.root_maxbytes: "25000000"
  kernel.keys.root_maxkeys: "1000000"
