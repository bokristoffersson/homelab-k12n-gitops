[defaults]
inventory = inventory.yml
# Collections live in the workspace (survives the --rm container); see requirements.yml
collections_path = ./collections
roles_path = ./roles
host_key_checking = True
interpreter_python = auto_silent
# yaml-formatted task results via the built-in default callback
# (community.general.yaml callback was removed in v12.0.0)
stdout_callback = default
result_format = yaml
retry_files_enabled = False

[privilege_escalation]
# bo has passwordless sudo (NOPASSWD sudoers file) on the nodes — no --ask-become-pass needed
become = True
become_method = sudo
become_user = root
