kafka:
  brokers: "redpanda-v2.redpanda-v2.svc.cluster.local:9092"
  topic: "homelab-energy-realtime"
  group_id: "energy-ws"
  auto_offset_reset: "latest"  # Only new messages for real-time

server:
  host: "0.0.0.0"
  port: 8080
  max_connections: 1000

auth:
  # JWKS-based validation (RS256) of Authelia access tokens
  issuers:
    - name: authelia
      issuer: "https://auth.k12n.com"
      jwks_url: "https://auth.k12n.com/jwks.json"

  # Legacy HS256 configuration (optional, for local auth)
  # jwt_secret: "$(JWT_SECRET)"
