[package]
name = "gasa-api"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "signal"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.5", features = ["trace"] }

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Config
regex = "1.10"

# Constant-time comparison for the iCal feed token
subtle = "2.6"

# Email (iCloud SMTP, rustls to avoid OpenSSL in the slim runtime image)
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "pool", "tokio1", "tokio1-rustls-tls"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
